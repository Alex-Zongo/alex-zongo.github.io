venue: "Manuscript in preparation · 2026"
affiliation: "UC Berkeley (CITRIS) · The George Washington University"
subtitle: "Predicting aircraft motion from ADS-B and imperfectly recognized controller speech"
takeaway: "Where will the aircraft go, given what the controller said?"
lead: "A controller instruction changes an aircraft's next minute of flight before any sensor sees it. Speech recognizers mishear callsigns, numbers and turn directions, so we treat each transcribed transmission as uncertain evidence: estimate which structured instructions it supports, including whether it addresses this aircraft at all, then predict the trajectory under each."
demo:
  type: iframe
  src: /demos/atc-traj/index.html
  height: 980
  label: "Interactive demo"
  caption: "Static version: every prediction was computed in advance on held-out recorded flights with synthetic transmissions, using the paper's models (first training run). Live sector: transmissions arrive on a shared frequency, the addressed aircraft is identified across the aircraft, and its 50% and 90% regions are drawn at +20, +40 and +60 s. Try a transmission and Compare models: switch semantic models and trajectory predictors. Scroll on a plot to zoom. To type your own transmissions, run the demo locally from the repository."
metrics:
  - value: "92%"
    label: "of the improvement that the true instruction gives over ADS-B-only prediction, kept from an imperfect transcript (synthetic test set)"
  - value: "22%"
    label: "lower energy score than ADS-B-only prediction on 4,863 recorded controller transmissions, with no model trained on them"
  - value: "93%"
    label: "of those recorded transmissions: the addressed aircraft ranked first among nearby aircraft"
metrics_note: "Energy score of 60 s horizontal trajectories, in metres, lower is better; means over three training runs. Synthetic test set: 5,000 held-out trajectory segments with simulated recognition errors. Recorded speech: San Francisco and Boston, July 2026, a group-internal evaluation set that is not released."
sections:
  - id: problem
    nav: "Problem"
    eyebrow: "01 / The problem"
    title: "Instructions arrive as noisy speech."
    text: >
      Trajectory predictors used in air traffic management extrapolate from surveillance
      history. They cannot anticipate a turn or a descent that a controller has just issued,
      because the aircraft has not started it yet. The instruction is on the radio, but a
      machine only receives it through automatic speech recognition (ASR), which drops and confuses
      words. Every aircraft on the frequency also hears every transmission, and most transmissions
      are addressed to someone else.
    points:
      - title: "What is uncertain"
        text: "Whether the transmission addresses this aircraft, and which heading, altitude or speed it instructs. A misheard callsign, a lost “left” or “right”, or a wrong digit each changes the trajectory."
      - title: "What is available"
        text: "The ASR transcript with each word's confidence, the aircraft's own callsign and its last 30 s of ADS-B."
      - title: "What is predicted"
        text: "A distribution over the next 60 s of flight, evaluated against the flown trajectory with the energy score (a proper scoring rule for distributions, in metres, lower is better) and the coverage of its prediction intervals."
  - id: method
    nav: "Method"
    eyebrow: "02 / The approach"
    title: "Estimate the instruction, then predict under each candidate."
    text: >
      A structured instruction representation Z records whether a transmission addresses this
      aircraft and its lateral, vertical and speed instruction. A semantic belief model (SBM)
      reads the transcript, the word confidences, the aircraft's callsign and its history, and
      returns a probability distribution over these representations. A conditional trajectory
      predictor (CTP), trained with flow matching on 18 trajectory-shape coefficients, samples
      future trajectories under a given representation. The composed prediction samples 12
      representations from the belief and 6 trajectories under each, so the uncertainty about
      the instruction reaches the predicted trajectories.
    equation: "p(Y \\mid O, X) \\;\\approx\\; \\sum_{Z} q_\\phi(Z \\mid O, X)\\, p_\\theta(Y \\mid X, Z)"
    equation_note: "Y: future trajectory. O: transcript with word confidences. X: surveillance history, aircraft state and callsign. Z: structured instruction representation."
    figure:
      src: "/images/atc-traj/method_overview.svg"
      alt: "The SBM encodes the transcript, confidences and surveillance input and samples K structured instruction representations. The CTP combines each with the trajectory history and samples S coefficient vectors, decoded into K × S future trajectories."
      caption: "Overview. Semantic uncertainty varies the representation that conditions the trajectory predictor; conditional motion uncertainty varies the trajectories under it. The representation is the interface between the two models, so each can be trained, inspected and replaced on its own."
    details:
      - title: "Why an explicit representation instead of conditioning on the text?"
        text: "A trajectory predictor conditioned directly on the transcript reaches an energy score of 2,187 m on own-aircraft maneuver instructions (2,108 m with its text encoder initialized from the SBM), against 1,682 m for composition through structured representations. The representation is also readable: an engineer or a controller can check which instructions the model considered and with what probability."
      - title: "How do the sampler and the distribution family trade accuracy against calibration?"
        text: "The flow with 12 Euler steps gives the lowest energy score over all transmissions, but its central 90% interval contains the flown position only 86% of the time, so it is slightly overconfident. With the same weights, 32 Heun steps bring coverage close to 90% and lower the energy score, at about five times the computation. A mixture-density head on the same coefficients reaches nominal coverage and a similar score on maneuver instructions, but a higher score over all transmissions."
        figure:
          src: "/images/atc-traj/fig_tradeoff.svg"
          alt: "Energy score against coverage of the central 90% interval for the flow with 12 Euler steps, the same flow with 32 Heun steps, and the mixture-density head; panel (a) own-aircraft maneuver instructions, panel (b) all transmissions."
          caption: "Accuracy against calibration; the dashed line marks nominal 90% coverage. (a) Own-aircraft maneuver instructions. (b) All transmissions. Means over three training runs."
      - title: "Which aircraft is the transmission addressed to?"
        text: "Each aircraft's belief includes the probability that the transmission addresses it. A transmission addresses at most one aircraft, so the evidence is normalized across the aircraft nearby. In constructed scenes of eight aircraft the addressed aircraft is ranked first for 87% of transmissions. For the aircraft that are not addressed, the prediction only beats ADS-B-only prediction when samples without motion content are routed to the ADS-B-only predictor."
  - id: sbm
    nav: "Semantic model"
    eyebrow: "03 / Inside the semantic belief model"
    title: "Reading the transcript against the aircraft's own callsign and flight path."
    text: >
      The text encoder reads the aircraft's own callsign from ADS-B, a separator, and the
      transcript, so the model can compare the callsign it hears with the one it expects. Each
      transcript word carries its recognizer confidence and two callsign-match features. A
      history encoder turns the last 30 s of ADS-B into six 5 s patches plus tokens for the
      current state and the aircraft type. Four queries, one per field (whether the transmission
      addresses this aircraft, lateral, vertical, speed), read both encodings through attention
      and exchange information with each other. In use, the fields are sampled one after another,
      each conditioned on the ones already chosen, so the sampled instructions stay coherent: once
      "another aircraft" is drawn, no turn or climb follows. In training, a random subset of the
      fields is revealed and the model predicts the rest, which teaches it every order at once.
      Field temperatures fitted on validation data calibrate the probabilities. About 2.0 million
      parameters.
    figure:
      src: "/images/atc-traj/fig_sbm.svg"
      alt: "Semantic belief model: a text encoder over the own callsign and the transcript with confidences, a history encoder over six 5 s patches, and a field decoder whose four queries use cross-attention to the text and the history and self-attention among the fields, producing categorical distributions over status, lateral, vertical and speed."
      caption: "Semantic belief model. Training reveals a random subset of fields and predicts the others; prediction samples the fields in a fixed order (status, lateral, vertical, speed), K times, and beam search finds the most probable instruction."
  - id: ctp
    nav: "Trajectory model"
    eyebrow: "04 / Inside the conditional trajectory predictor"
    title: "A flow over trajectory shapes, conditioned on history and instruction."
    text: >
      The trajectory predictor encodes the same 30 s of history with its own encoder, and turns a
      sampled instruction into four tokens. The motion tokens also carry features relative to the
      aircraft's present state, such as the turn or altitude change the instruction requires, so
      "descend to 5,000 ft" means a long descent from 8,000 ft and a short one from 6,000 ft.
      Together these twelve tokens form the memory that a flow decoder reads through
      cross-attention. Trained with flow matching, the decoder moves Gaussian noise to the 18
      coefficients of a trajectory shape in 12 Euler steps. The coefficients are decoded into
      velocities and integrated into positions. About 2.2 million parameters; one composed
      prediction of 72 trajectories takes about 0.18 s on a laptop CPU.
    figure:
      src: "/images/atc-traj/fig_ctp.svg"
      alt: "Conditional trajectory predictor: an instruction encoder and a history encoder form a twelve-token memory; a flow decoder with self-attention among 18 coefficient tokens and cross-attention to the memory, modulated by flow time, integrates noise into coefficients that are decoded into future trajectories."
      caption: "Conditional trajectory predictor. The memory is computed once per sampled instruction and reused across its trajectories and the integration steps."
    details:
      - title: "Why predict 18 shape coefficients instead of the position at every second?"
        text: "A 60 s future has 180 numbers per trajectory (a velocity on three axes at each second), but they move together: a turn is one smooth change in heading, not 60 independent ones. We describe each future by how it departs from flying straight at constant speed, scale that departure per second, and take the principal components of the training futures on each axis. Six along-track, four cross-track and eight vertical shapes keep 99.6%, 99.2% and 99.0% of the variation, so 18 coefficients replace 180 values. This has three effects. Every sample is a smooth, physically plausible shape, because it is built from shapes seen in real flights. The flow models the joint distribution of a few strongly informative numbers instead of 180 correlated ones, which is easier to learn and cheaper to sample. And the comparison favours it: a flow on the 180 per-second velocities raises the energy score by 1.0% on own-aircraft maneuver instructions and by 5.1% over all transmissions, although its coverage is slightly closer to nominal (0.88 against 0.86). Fixed sine shapes with the same count match the accuracy on maneuvers but lose 1.3% over all transmissions and are more overconfident (coverage 0.83), so the learned shapes matter, not only their number. The price is a small reconstruction error, about 1% of the variance, and shapes that reflect the training traffic: aircraft dynamics and instruction compliance are not enforced."
        figure:
          src: "/images/atc-traj/fig_basis.svg"
          alt: "Trajectory basis: (a) share of variance per principal component for the along-track, cross-track and vertical axes; (b) a recorded turn's cross-track residual velocity rebuilt from the mean and one, two and four components; (c) the first two vertical components against their nearest sine functions."
          caption: "Trajectory basis. (a) Variance explained per component on each axis. (b) A recorded turn rebuilt from the mean and the first components. (c) The first two vertical shapes against the nearest sines."
      - title: "What do the shapes look like?"
        text: "Each curve is the residual velocity that a one-standard-deviation coefficient adds over the 60 s horizon. The first along-track shape is a steady speed change; the first cross-track shape is a turn that builds up and settles; the vertical shapes include climbs and descents that start, level off or reverse. Any predicted future is the mean (dashed) plus a weighted sum of these shapes."
        figure:
          src: "/images/atc-traj/fig_basis_components.svg"
          alt: "Principal-component shapes of the residual velocity for the along-track (six), cross-track (four) and vertical (eight) axes, in metres per second per standard deviation, over 60 s; dashed: the mean."
          caption: "The 18 retained shapes, each drawn for a one-standard-deviation coefficient; dashed: the mean residual."
  - id: results
    nav: "Results"
    eyebrow: "05 / Synthetic test set"
    title: "Keeping the alternatives beats committing to one."
    text: >
      On 5,000 held-out trajectory segments with simulated recognition errors, the composed
      prediction keeps 92% of the improvement that the semantic label, the instruction each
      synthetic transmission was generated from, gives over ADS-B-only prediction. It also beats
      conditioning on the single most probable instruction in every training run, mostly on the
      transmissions whose most probable instruction is wrong.
    table:
      caption: "Energy score (m, lower is better) on own-aircraft maneuver instructions and over all transmission categories. Means over three training runs, ± standard deviation."
      headers: ["Prediction", "Own-aircraft maneuver instructions", "All transmissions"]
      rows:
        - ["ADS-B only (ignores the radio)", "3,202", "2,988"]
        - ["Trajectory predictor conditioned on the transcript", "2,187", "2,751"]
        - ["Most probable instruction", "1,727 ± 2", "2,732"]
        - ["<strong>Composed over the belief</strong>", "<strong>1,682 ± 5</strong>", "<strong>2,701</strong>"]
        - ["Semantic label given (reference, not available in operation)", "1,556 ± 2", "2,615"]
      note: "ADS-B only remains better on transmissions that contain no motion instruction for the aircraft or address another aircraft (2,988 against 3,152 to 3,296 m). The trajectory predictor given the semantic label scores about the same there, so the gap lies in its prediction without an instruction, not in the semantic belief."
    figures:
      - src: "/images/atc-traj/fig_confidence.svg"
        alt: "Energy score of the most probable instruction, the composed prediction and the semantic label, grouped by the probability of the most probable instruction, with the share of transmissions where it is correct."
        caption: "Composition helps most when the belief is uncertain, where the most probable instruction is often wrong (final SBM, first training run)."
      - src: "/images/atc-traj/fig_addressee.svg"
        alt: "Scene energy score and share of transmissions whose recipient is ranked first, against the number of aircraft in constructed scenes."
        caption: "Constructed multi-aircraft scenes: recipient identification across the aircraft against judging each aircraft alone, with and without ADS-B-only routing."
  - id: real
    nav: "Recorded speech"
    eyebrow: "06 / Recorded controller speech"
    title: "The interface transfers to real radio."
    text: >
      We evaluated the models, with no training, tuning or selection on these data, on 4,863
      controller transmissions recorded at San Francisco and Boston in July 2026, transcribed by
      ATC-fine-tuned speech recognizers and matched to the ADS-B of the aircraft they name. Boston
      lies outside the region the trajectory models were trained on. The recordings have no human
      labels, so predictions are scored against the trajectory each aircraft then flew. Composition
      lowers the energy score by 22% relative to ADS-B-only prediction (34% on heading, altitude
      and speed instructions, 28% at Boston, and 23% on audio the recognizers never saw in
      training), and ranks the addressed aircraft first for 93% of transmissions.


      The limits are clear as well. Tower transmissions carry takeoff and landing clearances that
      the representation does not cover, and there ADS-B-only prediction is better. The vertical
      score does not improve overall, and the predictions are overconfident: nominal 90% intervals
      contain 81% of flown positions. The evaluation set belongs to a research collaboration and is
      not released; only aggregate results are reported.
    figure:
      src: "/images/atc-traj/fig_real_gains.svg"
      alt: "Reduction of the energy score on recorded controller transmissions, by instruction type, controller position and airport, against ADS-B-only prediction and against the most probable instruction."
      caption: "Recorded controller speech: reduction of the energy score (a) against ADS-B-only prediction and (b) against the most probable instruction, by instruction type, position and airport. Means over three training runs."
  - id: limits
    nav: "Scope"
    eyebrow: "07 / Scope"
    title: "What this does not do."
    points:
      - title: "Instructions"
        text: "Heading, altitude and speed instructions, one transmission at a time. Route, procedure, conditional, takeoff and landing clearances are outside the representation, and earlier clearances or readbacks are not used."
      - title: "Training data"
        text: "Synthetic controller transmissions generated on recorded ADS-B from five days over the San Francisco Bay Area, passed through a simulated recognizer. The labels describe the flown motion, not an instruction known to have been issued."
      - title: "Use"
        text: "A research prototype for prediction under communication uncertainty, not an operational tool. One prediction takes about 0.18 s on a laptop CPU."
figures_credit: "Figures and demo generated from the project's evaluation outputs."
acknowledgement: "This work was carried out within a CITRIS project at UC Berkeley. Aircraft surveillance data comes from the OpenSky Network; the recorded-speech evaluation set was assembled by Nathan McNaughton."
